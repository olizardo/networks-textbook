project:
  type: book
  output-dir: _sites
  resources:
    - .nojekyll
    - slides/
    - images/

book:
  title: Social Networks
  subtitle: An Introduction
  author: Omar Lizardo and Isaac Jilbert
  date: 1/15/2023
  site-url: "https://olizardo.github.io/networks-textbook/"
  repo-url: "https://github.com/olizardo/networks-textbook"
  navbar:
    right:
      - text: "Bruin Learn"
        icon: mortarboard
        href: "https://bruinlearn.ucla.edu/courses/238980"
      - text: "Assignments"
        href: "https://bruinlearn.ucla.edu/courses/238980/assignments"
      - text: "Syllabus"
        href: "https://bruinlearn.ucla.edu/courses/238980/assignments/syllabus"
  search:
    location: sidebar
    type: textbox
  page-navigation: true
  page-footer: "Copyright 2023, Omar Lizardo & Isaac Jilbert" 
  
  chapters:
    - index.qmd
    
    - part: "Introduction to Networks"
      chapters:
        - 01-theory-what-are-networks.qmd
        - 02-theory-what-are-social-networks.qmd
        - 03-theory-ties-bound.qmd
        - 04-theory-tie-strength.qmd
        - 05-theory-multiplex.qmd
        
    - part: "Networks and Graphs"
      chapters:
        - 06-graphs-intro.qmd
        - 07-graphs-ties.qmd
        - 08-graphs-dyads-triads.qmd
        - 09-graphs-metrics.qmd
        - 10-graphs-directed.qmd
        - 11-graphs-paths.qmd
        - 12-graphs-connectivity.qmd
        - 13-graphs-trees.qmd

    - part: "Networks and Matrices"
      chapters:
        - 14-matrix-intro.qmd
        - 15-matrix-network.qmd
        - 16-matrix-operations.qmd
        - 17-matrix-multiplication.qmd

    - part: "Centrality and Status"
      chapters:
        - 18-sna-degree-centrality.qmd
        - 19-sna-closeness.qmd
        - 20-sna-betweenness.qmd
        - 21-sna-bigthree.qmd
        - 22-sna-eigenvector.qmd
        - 23-sna-status.qmd
        - 24-sna-hubs-and-authorities.qmd

    - part: "Two-Mode & Ego Networks"
      chapters:
        - 25-sna-affiliation-networks.qmd
        - 26-sna-ego-networks.qmd
        - 27-sna-ego-collect.qmd
        - 28-sna-ego-homo.qmd
        - 29-sna-network-cognition.qmd

    - part: "Subgroups and Blocks"
      chapters:
        - 30-sna-groups-cliques.qmd
        - 31-sna-groups-cohesive.qmd
        - 32-sna-struct-equiv.qmd
        - 33-sna-advanced-equiv.qmd
        - 34-sna-local-similarity.qmd
        - 35-sna-blockmodeling.qmd

    - part: "Network Theory: Ties and Circles"
      chapters:
        - 36-theory-dunbar.qmd
        - 37-theory-swt.qmd
        - 38-theory-sht.qmd
        - 39-theory-smt.qmd

    - part: "Network Theory: Balance and Hierarchy"
      chapters:        
        - 40-theory-balance-dyadic.qmd
        - 41-theory-balance-triadic.qmd
        - 42-theory-balance-struct.qmd
        - 43-theory-valenced-interactions.qmd
        - 44-theory-hierarchies.qmd

    - part: "Network Theory: Dynamics and Diffusion"
      chapters: 
        - 45-theory-cycle-avoidance.qmd
        - 46-theory-diffusion.qmd
        - 47-theory-small-world.qmd

    - references.qmd



bibliography: networks.bib

format:
  html:
    css: styles.css
    page-layout: full
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom-dark.scss]    
    toc: true
    linkcolor: "#ff7e26"
    citation-location: margin
    reference-location: margin
    

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

editor:
  mode: source
  render-on-save: true
