name: Publish Website to GitHub Pages

on:
  push:
    branches:
      - main

# Set GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate References and Citations
        run: |
          python check_book_refs.py
          python check_book_citations.py

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No DESCRIPTION file in this project, so the package set is listed
          # explicitly. pak resolves and caches these; the cache key is
          # derived from this list, the R version, and the OS, so unrelated
          # commits restore the library instead of reinstalling it.
          packages: |
            any::ggraph
            any::tidygraph
            any::igraph
            any::kableExtra
            any::signnet
            any::dplyr
            any::colorspace
            any::patchwork
            any::expm
            any::DiagrammeR
            any::corrplot
            any::factoextra
            any::lsa
            any::sna
            any::conflicted
          cache: true
          cache-version: 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Book
        run: |
          quarto render

      - name: Determine changed slide decks
        id: changed-slides
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ github.event.before }}" != "$ZERO_SHA" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'slides/*.qmd')
          else
            # No usable base commit (first push, force-push, etc.) - render everything to be safe.
            CHANGED=$(git ls-files 'slides/*.qmd')
          fi
          echo "Changed/rendered slide decks:"
          echo "$CHANGED"
          {
            echo "files<<SLIDES_EOF"
            echo "$CHANGED"
            echo "SLIDES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render Slides
        run: |
          FILES="${{ steps.changed-slides.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No slide .qmd files changed; skipping slide rendering."
          else
            echo "$FILES" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "Rendering changed slide deck: $f"
              quarto render "$f"
            done
          fi

          # Copy sources plus any freshly rendered HTML/assets from the loop
          # above. Unchanged decks have no local HTML (gitignored) and simply
          # fall through to the keep_files behavior on deploy below.
          mkdir -p _sites/slides
          cp -r slides/* _sites/slides/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites
          # Preserve previously-deployed slide decks that weren't re-rendered
          # this run (since only changed decks are rebuilt, not all of them).
          keep_files: true
