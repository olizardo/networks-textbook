name: Publish Website to GitHub Pages

on:
  push:
    branches:
      - main

# Set GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate References and Citations
        run: |
          python check_book_refs.py
          python check_book_citations.py

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        run: |
          Rscript -e "install.packages(c('ggraph', 'tidygraph', 'igraph', 'kableExtra', 'signnet', 'dplyr', 'colorspace', 'patchwork', 'expm', 'DiagrammeR', 'corrplot', 'factoextra', 'lsa', 'sna', 'conflicted'))"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Book
        run: |
          quarto render

      - name: Render Slides
        run: |
          for f in slides/*.qmd; do
            echo "Rendering slide deck: $f"
            quarto render "$f"
          done
          mkdir -p _sites/slides
          cp -r slides/* _sites/slides/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites
