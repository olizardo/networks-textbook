name: Publish Website to GitHub Pages

on:
  push:
    branches:
      - main

# Set GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write

# Prevent concurrent deploy runs from racing on the gh-pages branch: two
# pushes to main in quick succession otherwise both fetch the same gh-pages
# head and the second push is rejected as non-fast-forward. The newer run
# wins; the superseded one is cancelled.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # CI installs the package set explicitly via r-lib/actions/setup-r-dependencies
      # (below) into the site library. The renv autoloader in .Rprofile must NOT
      # activate there: when it does, setup-r-dependencies detects an renv project
      # and expects `pak` to already exist in the project renv library, which a
      # freshly cached library for a new R version does not have ("no package
      # called 'pak'"). Local/interactive sessions are unaffected by this env var.
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate References and Citations
        run: |
          python check_book_refs.py
          python check_book_citations.py

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No DESCRIPTION file in this project, so the package set is listed
          # explicitly. pak resolves and caches these; the cache key is
          # derived from this list, the R version, and the OS, so unrelated
          # commits restore the library instead of reinstalling it.
          packages: |
            any::ggraph
            any::tidygraph
            any::igraph
            any::kableExtra
            any::signnet
            any::dplyr
            any::colorspace
            any::patchwork
            any::expm
            any::DiagrammeR
            any::corrplot
            any::factoextra
            any::lsa
            any::sna
            any::conflicted
          cache: true
          cache-version: 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Book
        run: |
          quarto render

      - name: Determine changed slide decks
        id: changed-slides
        run: |
          # Diff against the LAST SUCCESSFULLY DEPLOYED commit, recorded in a
          # marker file on the gh-pages branch. Diffing against
          # github.event.before silently drops decks whose deploying run was
          # cancelled by the concurrency guard: the superseded run never
          # deploys, and the next run's before..sha diff no longer lists
          # those decks. The marker only advances when a run deploys, so a
          # cancelled run's decks are picked up by the next deploy.
          BASE=""
          if git show origin/gh-pages:.deploy-marker >/dev/null 2>&1; then
            BASE=$(git show origin/gh-pages:.deploy-marker | tr -d '[:space:]')
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BASE" "${{ github.sha }}" 2>/dev/null; then
              echo "Deploying changes since last successful deploy: $BASE"
            else
              # Force-push, marker for an unrelated history, etc. — render everything.
              BASE=""
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "No valid deploy marker found; rendering all decks."
            CHANGED=$(git ls-files 'slides/*.qmd')
          else
            CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- 'slides/*.qmd')
          fi
          echo "Changed/rendered slide decks:"
          echo "$CHANGED"
          {
            echo "files<<SLIDES_EOF"
            echo "$CHANGED"
            echo "SLIDES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render Slides
        run: |
          FILES="${{ steps.changed-slides.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No slide .qmd files changed; skipping slide rendering."
          else
            echo "$FILES" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "Rendering changed slide deck: $f"
              quarto render "$f"
            done
          fi

          # Copy sources plus any freshly rendered HTML/assets from the loop
          # above. Unchanged decks have no local HTML (gitignored) and simply
          # fall through to the keep_files behavior on deploy below.
          mkdir -p _sites/slides
          cp -r slides/* _sites/slides/

      - name: Record deploy marker
        run: echo "${{ github.sha }}" > _sites/.deploy-marker

      - name: Audit slide sizes (size floor)
        # Measures rendered matrices/figures in headless Chrome against the
        # minimum-size floors in audit_slide_sizes.py (math >= 34px, figures
        # not downscaled below 75%). Currently non-blocking: pre-existing
        # figure violations are being worked down. To enforce on every
        # deploy, set continue-on-error to false.
        continue-on-error: true
        run: |
          FILES="${{ steps.changed-slides.outputs.files }}"
          if [ -n "$FILES" ]; then
            echo "$FILES" | while IFS= read -r f; do
              [ -n "$f" ] && AUDIT_FILES="$AUDIT_FILES $f"
            done
            python audit_slide_sizes.py --no-render $AUDIT_FILES
          else
            echo "No changed slide decks to audit."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites
          # Preserve previously-deployed slide decks that weren't re-rendered
          # this run (since only changed decks are rebuilt, not all of them).
          # The .deploy-marker file (written fresh above) is replaced each
          # successful deploy and records the deployed commit SHA.
          keep_files: true
