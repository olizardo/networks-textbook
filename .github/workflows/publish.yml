name: Publish Website to GitHub Pages

on:
  push:
    branches:
      - main

# Set GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R package dependencies
        run: |
          Rscript -e "install.packages(c('ggraph', 'tidygraph', 'igraph', 'kableExtra', 'signnet', 'dplyr', 'colorspace', 'patchwork'), repos='https://cran.rstudio.com/')"
        shell: pwsh

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Project
        run: |
          quarto render
        shell: pwsh

      - name: Render Slides
        run: |
          quarto render slides/
          New-Item -ItemType Directory -Force -Path _sites/slides
          Copy-Item -Path slides/* -Destination _sites/slides/ -Recurse -Force
        shell: pwsh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites
